<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="How a change flows through maxdev">
<style>
.t{font:700 17px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#f5f7ff} .s{font:13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#a9b4d0} .m{font:12.5px SFMono-Regular,Consolas,Menlo,monospace;fill:#a9b4d0}
